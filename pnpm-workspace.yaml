packages:
  - "packages/*"
  - "playgrounds/*"

# The Astro 6 CI job installs these. Their binaries come from optional dependencies, so the scripts are not necessary.
allowBuilds:
  esbuild: false
  sharp: false

catalog:
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  astro: ^7.3.8
  react: ^19.3.0
  react-dom: ^19.3.0
  vite: ^8.3.4
  vue: ^3.5.43
