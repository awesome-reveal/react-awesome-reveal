name: Release

on:
  push:
    branches:
      - main
      - next

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      sha: ${{ steps.release-commit.outputs.sha }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ github.ref_name }}
          # A PR that GITHUB_TOKEN opens starts no workflows. A personal token starts CI on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # A queued run can release a commit other than github.sha. One release PR releases all packages from one commit.
      - name: Find the release commit
        id: release-commit
        if: steps.release.outputs.releases_created == 'true'
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          shas=$(jq -c '[to_entries[] | select(.key | endswith("--sha")) | .value] | unique' <<<"$OUTPUTS")
          if [[ "$(jq length <<<"$shas")" != 1 ]]; then
            echo "::error::Expected one release commit, found $shas"
            exit 1
          fi
          echo "sha=$(jq -r '.[0]' <<<"$shas")" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release PR can come from a token that starts no CI, so the publish job checks the packages itself.
      - name: Test package
        run: pnpm test:package

      # The release commit is checked out as a detached HEAD, so pnpm's branch check would fail.
      # pnpm skips the versions that are already on npm, so a re-run publishes only the missing packages.
      - name: Publish
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        # A prerelease goes to latest while the package has no stable version, so that a plain install gets it.
        run: |
          latest=()
          next=()
          for path in $(jq -r '.[]' <<<"$PATHS_RELEASED"); do
            name=$(jq -r .name "$path/package.json")
            version=$(jq -r .version "$path/package.json")
            # Only a missing package counts as "no stable version". Other errors stop the job,
            # so that a registry outage cannot send a prerelease to latest.
            if ! current=$(npm view "$name" dist-tags.latest 2>"$RUNNER_TEMP/npm-view.log"); then
              grep -q E404 "$RUNNER_TEMP/npm-view.log" || { cat "$RUNNER_TEMP/npm-view.log"; exit 1; }
              current=
            fi
            if [[ $version == *-* && -n $current && $current != *-* ]]; then
              next+=(--filter "./$path")
            else
              latest+=(--filter "./$path")
            fi
          done
          if ((${#latest[@]})); then pnpm "${latest[@]}" publish --no-git-checks --tag latest; fi
          if ((${#next[@]})); then pnpm "${next[@]}" publish --no-git-checks --tag next; fi
