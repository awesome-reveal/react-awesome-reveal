name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork and Dependabot PRs get no repository secrets.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # plugin_marketplaces takes no git ref, so a local clone pins the marketplace.
      - name: Fetch the plugin marketplace
        env:
          MARKETPLACE_SHA: 2301018b1f61073c501a8e7a4813ef48c239163b # v2.1.296
        run: |
          git init -q "$RUNNER_TEMP/claude-code"
          git -C "$RUNNER_TEMP/claude-code" fetch -q --depth 1 https://github.com/anthropics/claude-code.git "$MARKETPLACE_SHA"
          git -C "$RUNNER_TEMP/claude-code" checkout -q FETCH_HEAD

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ runner.temp }}/claude-code
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"
