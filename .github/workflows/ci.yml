name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  unit:
    name: Unit and SSR (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
        include:
          - react: 18
            deps: react@18 react-dom@18 @types/react@18 @types/react-dom@18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: ${{ !matrix.deps }}
        run: pnpm install --frozen-lockfile

      # pnpm add installs the rest of the dependencies too.
      - name: Install dependencies with React ${{ matrix.react }}
        if: ${{ matrix.deps }}
        run: pnpm --filter @awesome-reveal/react add -D ${{ matrix.deps }}

      - name: Test
        run: pnpm vitest run --project "*:unit" --project "*:ssr" --coverage --reporter=default --reporter=blob
        env:
          VITEST_BLOB_LABEL: react-${{ matrix.react }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-react-${{ matrix.react }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  # The browser tests cover only core, so they run once and not for each React version.
  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps --only-shell ${{ matrix.browser }}

      - name: Test
        run: pnpm vitest run --project "core:browser (${{ matrix.browser }})" --coverage --reporter=default --reporter=blob
        env:
          VITEST_BLOB_LABEL: ${{ matrix.browser }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-${{ matrix.browser }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

      - name: Upload failure screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: |
            .vitest/
            !.vitest/blob/
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Coverage
    needs: [unit, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          path: .vitest/blob/
          merge-multiple: true

      - name: Merge reports and check coverage
        run: pnpm vitest --merge-reports --coverage

      - name: Add coverage to the job summary
        run: |
          {
            echo "### Coverage"
            echo
            echo "| Metric | Coverage | Covered |"
            echo "| --- | ---: | ---: |"
            jq -r '.total | to_entries[] | select(.key != "branchesTrue")
              | "| \((.key[:1] | ascii_upcase) + .key[1:]) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"' \
              coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test package
        run: pnpm test:package

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
