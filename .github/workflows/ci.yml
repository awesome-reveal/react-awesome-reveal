name: CI

on:
  push:
    branches:
      - main
      - v5
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: Test (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        react: [17, 18, 19]
        include:
          - react: 17
            deps: react@17 react-dom@17 @testing-library/react@12
          - react: 18
            deps: react@18 react-dom@18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: ${{ !matrix.deps }}
        run: pnpm install --frozen-lockfile

      # pnpm add installs the rest of the dependencies too.
      - name: Install dependencies with React ${{ matrix.react }}
        if: ${{ matrix.deps }}
        run: pnpm add -D -w ${{ matrix.deps }}

      - name: Test
        run: pnpm test --coverage

      - name: Add coverage to the job summary
        run: |
          {
            echo "### Coverage"
            echo
            echo "| Metric | Coverage | Covered |"
            echo "| --- | ---: | ---: |"
            jq -r '.total | to_entries[] | select(.key != "branchesTrue")
              | "| \((.key[:1] | ascii_upcase) + .key[1:]) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"' \
              coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test package
        run: pnpm test:package
