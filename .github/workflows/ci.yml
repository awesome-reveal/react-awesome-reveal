name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: Test (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    # The image has the browsers and their system packages. Its tag must match the playwright version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
        include:
          - react: 18
            deps: react@18 react-dom@18 @types/react@18 @types/react-dom@18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: ${{ !matrix.deps }}
        run: pnpm install --frozen-lockfile

      # pnpm add installs the rest of the dependencies too.
      - name: Install dependencies with React ${{ matrix.react }}
        if: ${{ matrix.deps }}
        run: pnpm --filter @awesome-reveal/react add -D ${{ matrix.deps }}

      - name: Test
        run: pnpm test --coverage

      - name: Upload failure screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results-react-${{ matrix.react }}
          path: .vitest/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Add coverage to the job summary
        # The Playwright image has no jq.
        run: |
          node --input-type=module >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import { readFileSync } from "node:fs";
          const { total } = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
          console.log("### Coverage\n\n| Metric | Coverage | Covered |\n| --- | ---: | ---: |");
          for (const [key, { pct, covered, total: all }] of Object.entries(total)) {
            if (key === "branchesTrue") continue;
            console.log(`| ${key[0].toUpperCase()}${key.slice(1)} | ${pct}% | ${covered} / ${all} |`);
          }
          EOF

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test package
        run: pnpm test:package

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
