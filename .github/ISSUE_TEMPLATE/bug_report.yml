name: Bug report
description: Report a problem with an awesome-reveal package.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For questions and ideas, use [Discussions](https://github.com/awesome-reveal/awesome-reveal/discussions).
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@awesome-reveal/react"
        - "@awesome-reveal/vue"
        - "@awesome-reveal/core"
        - react-awesome-reveal
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: framework-version
    attributes:
      label: Framework version
      description: The framework and its version, if you use an adapter.
      placeholder: "React 19.2.0"
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Safari 18.4"
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A StackBlitz link that shows the bug. Start from a template, such as [vite.new/react-ts](https://vite.new/react-ts) or [vite.new/vue-ts](https://vite.new/vue-ts), and add the package.
      placeholder: "https://stackblitz.com/edit/..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the reproduction.
        2. Scroll to the second section.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
